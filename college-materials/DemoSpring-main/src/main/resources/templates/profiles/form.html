<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head th:replace="~{layout :: head(${pageTitle})}"></head>
<body>
    <div th:replace="~{layout :: sidebar}"></div>
    <div class="main-wrapper">
        <div th:replace="~{layout :: topbar(${pageTitle})}"></div>
        <div class="content-area">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card">
                        <div class="card-header">
                            <h6 class="fw-bold mb-0">
                                <i class="fas fa-id-card text-primary me-2"></i>
                                <span th:text="${pageTitle}">Form Profile</span>
                            </h6>
                        </div>
                        <div class="card-body">
                            <form th:action="${profile.id == null} ? @{/profiles/create} : @{'/profiles/edit/' + ${profile.id}}"
                                  th:object="${profile}"
                                  method="post">

                                <!-- Pilih User (hanya saat create) -->
                                <div class="mb-3" th:if="${profile.id == null}">
                                    <label class="form-label">
                                        <i class="fas fa-user text-muted me-1"></i>User <span class="text-danger">*</span>
                                    </label>
                                    <select name="userId" class="form-select" required>
                                        <option value="">-- Pilih User --</option>
                                        <option th:each="u : ${users}"
                                                th:value="${u.id}"
                                                th:text="${u.username} + ' (' + ${u.email} + ')'">User</option>
                                    </select>
                                </div>

                                <div th:if="${profile.id != null}" class="mb-3 p-3 bg-light rounded-3">
                                    <small class="text-muted">User:</small>
                                    <div class="fw-semibold" th:text="${profile.user.username}">-</div>
                                </div>

                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label">Nama Lengkap</label>
                                        <input type="text" class="form-control" th:field="*{fullName}" placeholder="Masukkan nama lengkap">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">No. Telepon</label>
                                        <input type="text" class="form-control" th:field="*{phone}" placeholder="Contoh: 08123456789">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Jenis Kelamin</label>
                                        <select class="form-select" th:field="*{gender}">
                                            <option value="">-- Pilih --</option>
                                            <option value="Laki-laki">Laki-laki</option>
                                            <option value="Perempuan">Perempuan</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Tanggal Lahir</label>
                                        <input type="date" class="form-control" th:field="*{birthDate}">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label">Alamat</label>
                                        <textarea class="form-control" th:field="*{address}" rows="2" placeholder="Masukkan alamat lengkap"></textarea>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label">Bio</label>
                                        <textarea class="form-control" th:field="*{bio}" rows="3" placeholder="Ceritakan tentang diri Anda..."></textarea>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label">URL Avatar</label>
                                        <input type="text" class="form-control" th:field="*{avatarUrl}" placeholder="https://...">
                                    </div>
                                </div>

                                <div class="d-flex gap-2 mt-4">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="fas fa-save me-2"></i>
                                        <span th:text="${profile.id == null} ? 'Simpan Profile' : 'Update Profile'">Simpan</span>
                                    </button>
                                    <a th:href="@{/profiles}" class="btn btn-outline-secondary">
                                        <i class="fas fa-arrow-left me-2"></i>Kembali
                                    </a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
