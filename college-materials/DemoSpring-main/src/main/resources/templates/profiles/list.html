<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head th:replace="~{layout :: head('Profiles')}"></head>
<body>
    <div th:replace="~{layout :: sidebar}"></div>
    <div class="main-wrapper">
        <div th:replace="~{layout :: topbar('Manajemen Profile')}"></div>
        <div class="content-area">
            <div th:if="${successMsg}" class="alert alert-success alert-dismissible d-flex align-items-center gap-2 mb-4">
                <i class="fas fa-check-circle"></i>
                <span th:text="${successMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible d-flex align-items-center gap-2 mb-4">
                <i class="fas fa-exclamation-circle"></i>
                <span th:text="${errorMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="fw-bold mb-0"><i class="fas fa-id-card text-primary me-2"></i>Daftar Profile</h6>
                        <small class="text-muted"><span class="badge bg-primary me-1">One-to-One</span> dengan tabel Users</small>
                    </div>
                    <a th:href="@{/profiles/create}" class="btn btn-primary">
                        <i class="fas fa-plus me-2"></i>Tambah Profile
                    </a>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>User</th>
                                    <th>Nama Lengkap</th>
                                    <th>Telepon</th>
                                    <th>Gender</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="profile, stat : ${profiles}">
                                    <td th:text="${stat.index + 1}">1</td>
                                    <td>
                                        <div class="d-flex align-items-center gap-2">
                                            <div class="avatar" th:style="'background: hsl(' + ${profile.user.id * 47} + ', 65%, 55%)'">
                                                <span th:text="${#strings.toUpperCase(#strings.substring(profile.user.username, 0, 2))}">US</span>
                                            </div>
                                            <span class="fw-semibold" th:text="${profile.user.username}">-</span>
                                        </div>
                                    </td>
                                    <td th:text="${profile.fullName ?: '-'}">-</td>
                                    <td th:text="${profile.phone ?: '-'}">-</td>
                                    <td>
                                        <span th:if="${profile.gender == 'Laki-laki'}" class="badge bg-primary">
                                            <i class="fas fa-mars me-1"></i>Laki-laki
                                        </span>
                                        <span th:if="${profile.gender == 'Perempuan'}" class="badge bg-danger">
                                            <i class="fas fa-venus me-1"></i>Perempuan
                                        </span>
                                        <span th:if="${profile.gender != 'Laki-laki' && profile.gender != 'Perempuan'}" class="badge bg-secondary">-</span>
                                    </td>
                                    <td>
                                        <div class="btn-group btn-group-sm">
                                            <a th:href="@{'/profiles/edit/' + ${profile.id}}" class="btn btn-outline-warning">
                                                <i class="fas fa-edit"></i>
                                            </a>
                                            <form th:action="@{'/profiles/delete/' + ${profile.id}}" method="post" style="display:inline">
                                                <button type="submit" class="btn btn-outline-danger btn-delete">
                                                    <i class="fas fa-trash"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(profiles)}">
                                    <td colspan="6" class="text-center py-5 text-muted">
                                        <i class="fas fa-id-card fa-3x mb-3 d-block opacity-25"></i>
                                        Belum ada data profile
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
