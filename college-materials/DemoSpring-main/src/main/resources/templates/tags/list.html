<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head th:replace="~{layout :: head('Tags')}"></head>
<body>
    <div th:replace="~{layout :: sidebar}"></div>
    <div class="main-wrapper">
        <div th:replace="~{layout :: topbar('Manajemen Tag')}"></div>
        <div class="content-area">

            <div th:if="${successMsg}" class="alert alert-success alert-dismissible d-flex align-items-center gap-2 mb-4">
                <i class="fas fa-check-circle"></i>
                <span th:text="${successMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible d-flex align-items-center gap-2 mb-4">
                <i class="fas fa-exclamation-circle"></i>
                <span th:text="${errorMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="alert d-flex align-items-center gap-2 mb-4"
                 style="background:#ede9fe;border:none;border-radius:12px;color:#4c1d95;">
                <i class="fas fa-info-circle"></i>
                <span>
                    <strong>Many-to-Many:</strong>
                    Satu tag bisa dimiliki banyak post, dan satu post bisa punya banyak tag.
                    Tabel join <code>post_tags</code> dibuat otomatis oleh JPA.
                </span>
            </div>

            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="fw-bold mb-0">
                            <i class="fas fa-tags text-primary me-2"></i>Daftar Tag
                        </h6>
                        <small class="text-muted">
                            <span class="badge bg-warning text-dark me-1">Many-to-Many</span>
                            dengan tabel Posts · join table: <code>post_tags</code>
                        </small>
                    </div>
                    <a th:href="@{/tags/create}" class="btn btn-primary">
                        <i class="fas fa-plus me-2"></i>Tambah Tag
                    </a>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Tag</th>
                                    <th>Warna</th>
                                    <th>Jumlah Post</th>
                                    <th>Dibuat</th>
                                    <th class="text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="tag, stat : ${tags}">
                                    <td class="text-muted" th:text="${stat.index + 1}">1</td>
                                    <td>
                                        <span class="badge px-3 py-2"
                                              th:style="'background-color:' + ${tag.color} + ';color:white;font-size:.85rem'"
                                              th:text="'# ' + ${tag.name}">tag</span>
                                    </td>
                                    <td>
                                        <div class="d-flex align-items-center gap-2">
                                            <div th:style="'width:24px;height:24px;border-radius:6px;background:' + ${tag.color}"></div>
                                            <code th:text="${tag.color}">#6366f1</code>
                                        </div>
                                    </td>
                                    <td>
                                        <span class="badge bg-secondary"
                                              th:text="${postCountMap.getOrDefault(tag.id, 0)} + ' post'">0 post</span>
                                    </td>
                                    <td>
                                        <small class="text-muted"
                                               th:text="${#temporals.format(tag.createdAt, 'dd MMM yyyy')}">-</small>
                                    </td>
                                    <td class="text-center">
                                        <div class="btn-group btn-group-sm">
                                            <a th:href="@{'/tags/edit/' + ${tag.id}}"
                                               class="btn btn-outline-warning" title="Edit">
                                                <i class="fas fa-edit"></i>
                                            </a>
                                            <form th:action="@{'/tags/delete/' + ${tag.id}}"
                                                  method="post" style="display:inline">
                                                <button type="submit"
                                                        class="btn btn-outline-danger btn-delete"
                                                        title="Hapus">
                                                    <i class="fas fa-trash"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(tags)}">
                                    <td colspan="6" class="text-center py-5 text-muted">
                                        <i class="fas fa-tags fa-3x mb-3 d-block opacity-25"></i>
                                        Belum ada data tag
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
