<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head th:replace="~{layout :: head('Posts')}"></head>
<body>
    <div th:replace="~{layout :: sidebar}"></div>
    <div class="main-wrapper">
        <div th:replace="~{layout :: topbar('Manajemen Post')}"></div>
        <div class="content-area">
            <div th:if="${successMsg}" class="alert alert-success alert-dismissible d-flex align-items-center gap-2 mb-4">
                <i class="fas fa-check-circle"></i>
                <span th:text="${successMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible d-flex align-items-center gap-2 mb-4">
                <i class="fas fa-exclamation-circle"></i>
                <span th:text="${errorMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="fw-bold mb-0"><i class="fas fa-file-alt text-success me-2"></i>Daftar Post</h6>
                        <small class="text-muted"><span class="badge bg-success me-1">One-to-Many</span> dari tabel Users</small>
                    </div>
                    <a th:href="@{/posts/create}" class="btn btn-success">
                        <i class="fas fa-plus me-2"></i>Tambah Post
                    </a>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Judul</th>
                                    <th>Author (User)</th>
                                    <th>Status</th>
                                    <th>Dibuat</th>
                                    <th class="text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="post, stat : ${posts}">
                                    <td th:text="${stat.index + 1}">1</td>
                                    <td>
                                        <div class="fw-semibold" th:text="${post.title}">Judul</div>
                                        <small class="text-muted"
                                               th:text="${post.content != null && post.content.length() > 60} ? ${#strings.substring(post.content, 0, 60)} + '...' : ${post.content}">
                                        </small>
                                    </td>
                                    <td>
                                        <div class="d-flex align-items-center gap-2">
                                            <div class="avatar" style="width:28px;height:28px;font-size:.65rem;border-radius:7px"
                                                 th:style="'width:28px;height:28px;font-size:.65rem;border-radius:7px;background:hsl(' + ${post.user.id * 47} + ', 65%, 55%)'">
                                                <span th:text="${#strings.toUpperCase(#strings.substring(post.user.username, 0, 2))}">US</span>
                                            </div>
                                            <span th:text="${post.user.username}">-</span>
                                        </div>
                                    </td>
                                    <td>
                                        <span th:class="${post.status.name() == 'PUBLISHED'} ? 'badge bg-success' : (${post.status.name() == 'DRAFT'} ? 'badge bg-warning text-dark' : 'badge bg-secondary')"
                                              th:text="${post.status}">-</span>
                                    </td>
                                    <td><small class="text-muted" th:text="${#temporals.format(post.createdAt, 'dd MMM yyyy')}">-</small></td>
                                    <td class="text-center">
                                        <div class="btn-group btn-group-sm">
                                            <a th:href="@{'/posts/edit/' + ${post.id}}" class="btn btn-outline-warning">
                                                <i class="fas fa-edit"></i>
                                            </a>
                                            <form th:action="@{'/posts/delete/' + ${post.id}}" method="post" style="display:inline">
                                                <button type="submit" class="btn btn-outline-danger btn-delete">
                                                    <i class="fas fa-trash"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(posts)}">
                                    <td colspan="6" class="text-center py-5 text-muted">
                                        <i class="fas fa-file-alt fa-3x mb-3 d-block opacity-25"></i>
                                        Belum ada data post
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
