<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - SpringCRUD'">SpringCRUD</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sidebar-width: 260px;
            --primary: #4f46e5;
            --primary-dark: #3730a3;
            --accent: #06b6d4;
            --sidebar-bg: #0f172a;
            --sidebar-text: #94a3b8;
            --sidebar-hover: #1e293b;
            --sidebar-active: #4f46e5;
        }

        * { font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #f1f5f9; min-height: 100vh; }

        /* SIDEBAR */
        .sidebar {
            width: var(--sidebar-width);
            min-height: 100vh;
            background: var(--sidebar-bg);
            position: fixed;
            top: 0; left: 0;
            z-index: 1000;
            transition: all .3s ease;
            box-shadow: 4px 0 20px rgba(0,0,0,.3);
        }
        .sidebar-brand {
            padding: 1.5rem 1.25rem;
            border-bottom: 1px solid #1e293b;
            display: flex;
            align-items: center;
            gap: .75rem;
        }
        .sidebar-brand .brand-icon {
            width: 38px; height: 38px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; color: white;
        }
        .sidebar-brand .brand-name {
            color: white;
            font-weight: 700;
            font-size: 1.1rem;
            line-height: 1.2;
        }
        .sidebar-brand .brand-sub {
            color: var(--sidebar-text);
            font-size: .7rem;
        }
        .sidebar-menu { padding: 1rem 0; }
        .sidebar-label {
            color: #475569;
            font-size: .65rem;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            padding: .75rem 1.25rem .25rem;
        }
        .sidebar-item { list-style: none; }
        .sidebar-link {
            display: flex;
            align-items: center;
            gap: .75rem;
            padding: .65rem 1.25rem;
            color: var(--sidebar-text);
            text-decoration: none;
            border-radius: 0;
            transition: all .2s;
            font-size: .88rem;
            font-weight: 500;
            position: relative;
        }
        .sidebar-link:hover {
            background: var(--sidebar-hover);
            color: #e2e8f0;
        }
        .sidebar-link.active {
            background: rgba(79,70,229,.15);
            color: #a5b4fc;
            border-right: 3px solid var(--primary);
        }
        .sidebar-link .icon-wrap {
            width: 32px; height: 32px;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: .85rem;
            background: rgba(255,255,255,.05);
        }
        .sidebar-link.active .icon-wrap {
            background: rgba(79,70,229,.3);
            color: #818cf8;
        }

        /* MAIN CONTENT */
        .main-wrapper {
            margin-left: var(--sidebar-width);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .topbar {
            background: white;
            border-bottom: 1px solid #e2e8f0;
            padding: .875rem 1.75rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 1px 8px rgba(0,0,0,.06);
        }
        .page-title {
            font-weight: 700;
            color: #0f172a;
            font-size: 1.05rem;
            margin: 0;
        }
        .content-area { padding: 1.75rem; flex: 1; }

        /* CARDS */
        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 1px 3px rgba(0,0,0,.07), 0 4px 16px rgba(0,0,0,.04);
        }
        .card-header {
            background: white;
            border-bottom: 1px solid #f1f5f9;
            border-radius: 16px 16px 0 0 !important;
            padding: 1.25rem 1.5rem;
        }
        .card-body { padding: 1.5rem; }

        /* STAT CARDS */
        .stat-card {
            border-radius: 16px;
            padding: 1.5rem;
            color: white;
            position: relative;
            overflow: hidden;
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: -20px; right: -20px;
            width: 100px; height: 100px;
            border-radius: 50%;
            background: rgba(255,255,255,.1);
        }
        .stat-card .stat-icon {
            width: 48px; height: 48px;
            background: rgba(255,255,255,.2);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem;
            margin-bottom: 1rem;
        }
        .stat-card .stat-value { font-size: 2rem; font-weight: 800; line-height: 1; }
        .stat-card .stat-label { font-size: .82rem; opacity: .85; margin-top: .25rem; }

        /* BUTTONS */
        .btn-primary { background: var(--primary); border-color: var(--primary); }
        .btn-primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); }
        .btn { border-radius: 8px; font-weight: 500; font-size: .875rem; }
        .btn-sm { padding: .3rem .7rem; }

        /* TABLES */
        .table { margin: 0; }
        .table thead th {
            background: #f8fafc;
            font-weight: 600;
            font-size: .78rem;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: #64748b;
            border-bottom: 1px solid #e2e8f0;
            padding: .875rem 1rem;
        }
        .table tbody td { padding: .875rem 1rem; vertical-align: middle; font-size: .875rem; }
        .table tbody tr:hover { background: #f8fafc; }

        /* BADGES */
        .badge { font-weight: 600; border-radius: 6px; font-size: .72rem; padding: .35em .65em; }

        /* FORMS */
        .form-control, .form-select {
            border-radius: 10px;
            border-color: #e2e8f0;
            padding: .6rem .9rem;
            font-size: .875rem;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79,70,229,.12);
        }
        .form-label { font-weight: 600; font-size: .82rem; color: #374151; margin-bottom: .4rem; }

        /* ALERTS */
        .alert { border-radius: 12px; border: none; font-size: .875rem; }
        .alert-success { background: #dcfce7; color: #166534; }
        .alert-danger { background: #fee2e2; color: #991b1b; }

        /* AVATAR */
        .avatar {
            width: 36px; height: 36px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700;
            font-size: .82rem;
            color: white;
        }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.show { transform: translateX(0); }
            .main-wrapper { margin-left: 0; }
        }
    </style>
</head>

<!-- SIDEBAR FRAGMENT -->
<nav th:fragment="sidebar" class="sidebar">
    <div class="sidebar-brand">
        <div class="brand-icon"><i class="fas fa-bolt"></i></div>
        <div>
            <div class="brand-name">SpringCRUD</div>
            <div class="brand-sub">Management System</div>
        </div>
    </div>
    <ul class="sidebar-menu list-unstyled">
        <li class="sidebar-label">Main</li>
        <li class="sidebar-item">
            <a th:href="@{/}" class="sidebar-link" th:classappend="${currentPage == 'dashboard'} ? 'active'">
                <span class="icon-wrap"><i class="fas fa-chart-pie"></i></span>
                Dashboard
            </a>
        </li>
        <li class="sidebar-label">Data</li>
        <li class="sidebar-item">
            <a th:href="@{/users}" class="sidebar-link" th:classappend="${currentPage == 'users'} ? 'active'">
                <span class="icon-wrap"><i class="fas fa-users"></i></span>
                Users
            </a>
        </li>
        <li class="sidebar-item">
            <a th:href="@{/profiles}" class="sidebar-link" th:classappend="${currentPage == 'profiles'} ? 'active'">
                <span class="icon-wrap"><i class="fas fa-id-card"></i></span>
                Profiles
            </a>
        </li>
        <li class="sidebar-item">
            <a th:href="@{/posts}" class="sidebar-link" th:classappend="${currentPage == 'posts'} ? 'active'">
                <span class="icon-wrap"><i class="fas fa-file-alt"></i></span>
                Posts
            </a>
        </li>
                <li class="sidebar-item">
            <a th:href="@{/tags}" class="sidebar-link" th:classappend="${currentPage == 'tags'} ? 'active'">
                <span class="icon-wrap"><i class="fas fa-tags"></i></span>
                Tags
            </a>
        </li>
        <li class="sidebar-label">API Docs</li>
        <li class="sidebar-item">
            <a href="#" class="sidebar-link" onclick="showApiDocs()">
                <span class="icon-wrap"><i class="fas fa-plug"></i></span>
                REST API
            </a>
        </li>
    </ul>
</nav>

<!-- TOPBAR FRAGMENT -->
<header th:fragment="topbar(title)" class="topbar">
    <div class="d-flex align-items-center gap-3">
        <button class="btn btn-sm btn-outline-secondary d-md-none" id="sidebarToggle">
            <i class="fas fa-bars"></i>
        </button>
        <h1 class="page-title" th:text="${title}">Page Title</h1>
    </div>
    <div class="d-flex align-items-center gap-2">
        <span class="badge bg-success-subtle text-success fw-semibold px-3 py-2">
            <i class="fas fa-circle text-success me-1" style="font-size:.5rem"></i>
            Connected
        </span>
    </div>
</header>

<!-- SCRIPTS FRAGMENT -->
<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        // Sidebar toggle mobile
        $('#sidebarToggle').click(function() {
            $('.sidebar').toggleClass('show');
        });

        // Auto-dismiss alerts
        setTimeout(function() {
            $('.alert').fadeOut('slow');
        }, 4000);

        // Confirm delete
        $('.btn-delete').click(function(e) {
            if (!confirm('Yakin ingin menghapus data ini?')) {
                e.preventDefault();
            }
        });

        function showApiDocs() {
            alert('REST API Endpoints:\n\n' +
                'USERS:\n  GET    /api/users\n  GET    /api/users/{id}\n  POST   /api/users\n  PUT    /api/users/{id}\n  DELETE /api/users/{id}\n\n' +
                'PROFILES:\n  GET    /api/profiles\n  GET    /api/profiles/{id}\n  GET    /api/profiles/user/{userId}\n  POST   /api/profiles?userId={id}\n  PUT    /api/profiles/{id}\n  DELETE /api/profiles/{id}\n\n' +
                'POSTS:\n  GET    /api/posts\n  GET    /api/posts/{id}\n  GET    /api/posts/user/{userId}\n  POST   /api/posts?userId={id}\n  PUT    /api/posts/{id}\n  DELETE /api/posts/{id}');
        }
    </script>
</div>
</html>
