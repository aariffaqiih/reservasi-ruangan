<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head th:replace="~{layout :: head('Users')}"></head>
<body>
    <div th:replace="~{layout :: sidebar}"></div>
    <div class="main-wrapper">
        <div th:replace="~{layout :: topbar('Manajemen User')}"></div>

        <div class="content-area">
            <!-- ALERTS -->
            <div th:if="${successMsg}" class="alert alert-success alert-dismissible d-flex align-items-center gap-2 mb-4" role="alert">
                <i class="fas fa-check-circle"></i>
                <span th:text="${successMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible d-flex align-items-center gap-2 mb-4" role="alert">
                <i class="fas fa-exclamation-circle"></i>
                <span th:text="${errorMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card">
                <div class="card-header d-flex align-items-center justify-content-between">
                    <div>
                        <h6 class="fw-bold mb-0"><i class="fas fa-users text-primary me-2"></i>Daftar User</h6>
                        <small class="text-muted" th:text="${users.size()} + ' data ditemukan'"></small>
                    </div>
                    <a th:href="@{/users/create}" class="btn btn-primary">
                        <i class="fas fa-plus me-2"></i>Tambah User
                    </a>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table" id="usersTable">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>User</th>
                                    <th>Email</th>
                                    <th>Profile</th>
                                    <th>Posts</th>
                                    <th>Dibuat</th>
                                    <th class="text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="user, stat : ${users}">
                                    <td class="text-muted" th:text="${stat.index + 1}">1</td>
                                    <td>
                                        <div class="d-flex align-items-center gap-2">
                                            <div class="avatar" th:style="'background: hsl(' + ${user.id * 47} + ', 65%, 55%)'">
                                                <span th:text="${#strings.toUpperCase(#strings.substring(user.username, 0, 2))}">US</span>
                                            </div>
                                            <div>
                                                <div class="fw-semibold" th:text="${user.username}">username</div>
                                                <small class="text-muted">ID: <span th:text="${user.id}"></span></small>
                                            </div>
                                        </div>
                                    </td>
                                    <td th:text="${user.email}">email</td>
                                    <td>
                                        <span th:if="${user.profile != null}" class="badge bg-success">
                                            <i class="fas fa-check me-1"></i>Ada
                                        </span>
                                        <span th:if="${user.profile == null}" class="badge bg-secondary">
                                            <i class="fas fa-times me-1"></i>Belum
                                        </span>
                                    </td>
                                    <td>
                                        <span class="badge bg-info" th:text="${user.posts.size()} + ' post'">0 post</span>
                                    </td>
                                    <td>
                                        <small class="text-muted"
                                               th:text="${#temporals.format(user.createdAt, 'dd MMM yyyy')}">-</small>
                                    </td>
                                    <td class="text-center">
                                        <div class="btn-group btn-group-sm">
                                            <a th:href="@{'/users/' + ${user.id} + '/detail'}"
                                               class="btn btn-outline-info" title="Detail">
                                                <i class="fas fa-eye"></i>
                                            </a>
                                            <a th:href="@{'/users/edit/' + ${user.id}}"
                                               class="btn btn-outline-warning" title="Edit">
                                                <i class="fas fa-edit"></i>
                                            </a>
                                            <form th:action="@{'/users/delete/' + ${user.id}}" method="post" style="display:inline">
                                                <button type="submit" class="btn btn-outline-danger btn-delete" title="Hapus">
                                                    <i class="fas fa-trash"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(users)}">
                                    <td colspan="7" class="text-center py-5 text-muted">
                                        <i class="fas fa-users fa-3x mb-3 d-block opacity-25"></i>
                                        Belum ada data user
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{layout :: scripts}"></div>
    <script>
        // Simple search
        $('#searchInput').on('keyup', function() {
            var val = $(this).val().toLowerCase();
            $('#usersTable tbody tr').filter(function() {
                $(this).toggle($(this).text().toLowerCase().indexOf(val) > -1);
            });
        });
    </script>
</body>
</html>
