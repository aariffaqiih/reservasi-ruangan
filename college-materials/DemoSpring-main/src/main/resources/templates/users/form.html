<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head th:replace="~{layout :: head(${pageTitle})}"></head>
<body>
    <div th:replace="~{layout :: sidebar}"></div>
    <div class="main-wrapper">
        <div th:replace="~{layout :: topbar(${pageTitle})}"></div>

        <div class="content-area">
            <div class="row justify-content-center">
                <div class="col-lg-7">
                    <div class="card">
                        <div class="card-header">
                            <h6 class="fw-bold mb-0">
                                <i class="fas fa-user-plus text-primary me-2" th:if="${user.id == null}"></i>
                                <i class="fas fa-user-edit text-warning me-2" th:if="${user.id != null}"></i>
                                <span th:text="${pageTitle}">Form User</span>
                            </h6>
                        </div>
                        <div class="card-body">
                            <form th:action="${user.id == null} ? @{/users/create} : @{'/users/edit/' + ${user.id}}"
                                  th:object="${user}"
                                  method="post">

                                <div class="mb-3">
                                    <label class="form-label">
                                        <i class="fas fa-user text-muted me-1"></i>Username <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" class="form-control"
                                           th:field="*{username}"
                                           th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
                                           placeholder="Masukkan username">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}"
                                         th:errors="*{username}">Error</div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">
                                        <i class="fas fa-envelope text-muted me-1"></i>Email <span class="text-danger">*</span>
                                    </label>
                                    <input type="email" class="form-control"
                                           th:field="*{email}"
                                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                           placeholder="Masukkan email">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}"
                                         th:errors="*{email}">Error</div>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label">
                                        <i class="fas fa-lock text-muted me-1"></i>Password
                                        <span class="text-danger" th:if="${user.id == null}">*</span>
                                        <small class="text-muted fw-normal" th:if="${user.id != null}">(Kosongkan jika tidak ingin mengubah)</small>
                                    </label>
                                    <div class="input-group">
                                        <input type="password" class="form-control" id="passwordInput"
                                               th:field="*{password}"
                                               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                                               placeholder="Masukkan password">
                                        <button type="button" class="btn btn-outline-secondary" id="togglePwd">
                                            <i class="fas fa-eye"></i>
                                        </button>
                                    </div>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}"
                                         th:errors="*{password}">Error</div>
                                </div>

                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="fas fa-save me-2"></i>
                                        <span th:text="${user.id == null} ? 'Simpan User' : 'Update User'">Simpan</span>
                                    </button>
                                    <a th:href="@{/users}" class="btn btn-outline-secondary">
                                        <i class="fas fa-arrow-left me-2"></i>Kembali
                                    </a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{layout :: scripts}"></div>
    <script>
        $('#togglePwd').click(function() {
            var input = $('#passwordInput');
            var type = input.attr('type') === 'password' ? 'text' : 'password';
            input.attr('type', type);
            $(this).find('i').toggleClass('fa-eye fa-eye-slash');
        });
    </script>
</body>
</html>
