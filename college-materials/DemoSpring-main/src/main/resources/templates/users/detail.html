<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head th:replace="~{layout :: head('Detail User')}"></head>
<body>
    <div th:replace="~{layout :: sidebar}"></div>
    <div class="main-wrapper">
        <div th:replace="~{layout :: topbar('Detail User')}"></div>

        <div class="content-area">
            <div class="row g-4">
                <!-- USER INFO -->
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-body text-center py-4">
                            <div class="avatar mx-auto mb-3"
                                 style="width:72px;height:72px;font-size:1.5rem;border-radius:18px"
                                 th:style="'width:72px;height:72px;font-size:1.5rem;border-radius:18px;background:hsl(' + ${user.id * 47} + ', 65%, 55%)'">
                                <span th:text="${#strings.toUpperCase(#strings.substring(user.username, 0, 2))}">US</span>
                            </div>
                            <h5 class="fw-bold mb-1" th:text="${user.username}">Username</h5>
                            <p class="text-muted mb-3" th:text="${user.email}">email</p>
                            <div class="d-flex justify-content-center gap-2">
                                <a th:href="@{'/users/edit/' + ${user.id}}" class="btn btn-warning btn-sm">
                                    <i class="fas fa-edit me-1"></i>Edit
                                </a>
                                <a th:href="@{/users}" class="btn btn-outline-secondary btn-sm">
                                    <i class="fas fa-arrow-left me-1"></i>Kembali
                                </a>
                            </div>
                        </div>
                        <div class="card-body border-top py-3">
                            <small class="text-muted d-block mb-1">
                                <i class="fas fa-calendar me-1"></i>
                                Dibuat: <span th:text="${#temporals.format(user.createdAt, 'dd MMM yyyy HH:mm')}">-</span>
                            </small>
                            <small class="text-muted d-block">
                                <i class="fas fa-clock me-1"></i>
                                Update: <span th:text="${#temporals.format(user.updatedAt, 'dd MMM yyyy HH:mm')}">-</span>
                            </small>
                        </div>
                    </div>
                </div>

                <div class="col-md-8">
                    <!-- PROFILE (ONE-TO-ONE) -->
                    <div class="card mb-4">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h6 class="fw-bold mb-0">
                                <i class="fas fa-id-card text-primary me-2"></i>
                                Profile
                                <span class="badge bg-primary ms-1">One-to-One</span>
                            </h6>
                            <a th:if="${profile == null}"
                               th:href="@{/profiles/create(userId=${user.id})}"
                               class="btn btn-sm btn-primary">
                                <i class="fas fa-plus me-1"></i>Buat Profile
                            </a>
                            <a th:if="${profile != null}"
                               th:href="@{'/profiles/edit/' + ${profile.id}}"
                               class="btn btn-sm btn-warning">
                                <i class="fas fa-edit me-1"></i>Edit Profile
                            </a>
                        </div>
                        <div class="card-body">
                            <div th:if="${profile == null}" class="text-center py-3 text-muted">
                                <i class="fas fa-id-card fa-2x mb-2 d-block opacity-25"></i>
                                Belum ada profile
                            </div>
                            <div th:if="${profile != null}">
                                <div class="row g-3">
                                    <div class="col-sm-6">
                                        <label class="form-label">Nama Lengkap</label>
                                        <p class="fw-semibold" th:text="${profile.fullName ?: '-'}">-</p>
                                    </div>
                                    <div class="col-sm-6">
                                        <label class="form-label">No. Telepon</label>
                                        <p class="fw-semibold" th:text="${profile.phone ?: '-'}">-</p>
                                    </div>
                                    <div class="col-sm-6">
                                        <label class="form-label">Jenis Kelamin</label>
                                        <p class="fw-semibold" th:text="${profile.gender ?: '-'}">-</p>
                                    </div>
                                    <div class="col-sm-6">
                                        <label class="form-label">Tanggal Lahir</label>
                                        <p class="fw-semibold"
                                           th:text="${profile.birthDate != null} ? ${#temporals.format(profile.birthDate, 'dd MMM yyyy')} : '-'">-</p>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label">Alamat</label>
                                        <p class="fw-semibold" th:text="${profile.address ?: '-'}">-</p>
                                    </div>
                                    <div class="col-12" th:if="${profile.bio != null}">
                                        <label class="form-label">Bio</label>
                                        <p class="fw-semibold" th:text="${profile.bio}">-</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- POSTS (ONE-TO-MANY) -->
                    <div class="card">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h6 class="fw-bold mb-0">
                                <i class="fas fa-file-alt text-success me-2"></i>
                                Posts
                                <span class="badge bg-success ms-1">One-to-Many</span>
                                <span class="badge bg-secondary ms-1" th:text="${posts.size()} + ' post'">0 post</span>
                            </h6>
                            <a th:href="@{/posts/create(userId=${user.id})}" class="btn btn-sm btn-success">
                                <i class="fas fa-plus me-1"></i>Tambah Post
                            </a>
                        </div>
                        <div class="card-body p-0">
                            <div th:if="${#lists.isEmpty(posts)}" class="text-center py-4 text-muted">
                                <i class="fas fa-file-alt fa-2x mb-2 d-block opacity-25"></i>
                                Belum ada post
                            </div>
                            <div th:each="post : ${posts}" class="border-bottom p-3">
                                <div class="d-flex justify-content-between align-items-start">
                                    <div>
                                        <div class="fw-semibold" th:text="${post.title}">Judul</div>
                                        <small class="text-muted" th:text="${#temporals.format(post.createdAt, 'dd MMM yyyy')}">-</small>
                                    </div>
                                    <div class="d-flex align-items-center gap-2">
                                        <span th:class="${post.status.name() == 'PUBLISHED'} ? 'badge bg-success' : (${post.status.name() == 'DRAFT'} ? 'badge bg-warning text-dark' : 'badge bg-secondary')"
                                              th:text="${post.status}">Status</span>
                                        <a th:href="@{'/posts/edit/' + ${post.id}}" class="btn btn-sm btn-outline-warning">
                                            <i class="fas fa-edit"></i>
                                        </a>
                                    </div>
                                </div>
                                <p class="text-muted small mt-1 mb-0"
                                   th:text="${post.content != null && post.content.length() > 80} ? ${#strings.substring(post.content, 0, 80)} + '...' : ${post.content}">
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
