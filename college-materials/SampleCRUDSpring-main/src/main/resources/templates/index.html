<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Perpustakaan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body{background:#f8f9fa;} .sidebar{min-height:100vh;background:#2c3e50;}
        .sidebar a{color:#ecf0f1;text-decoration:none;}
        .sidebar a:hover{background:#34495e;border-radius:5px;}
        .card{border:none;box-shadow:0 2px 10px rgba(0,0,0,.08);}
    </style>
</head>
<body>
<div class="container-fluid">
<div class="row">
    <div class="col-md-2 sidebar py-3 px-3">
        <h5 class="text-white text-center mb-4"><i class="bi bi-book-half"></i> Perpustakaan</h5>
        <hr class="text-white">
        <nav class="nav flex-column gap-1">
            <a href="/" class="nav-link px-3 py-2 active" style="background:#3498db;border-radius:5px;"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
            <a href="/buku" class="nav-link px-3 py-2"><i class="bi bi-journal-bookmark me-2"></i> Buku</a>
            <a href="/anggota" class="nav-link px-3 py-2"><i class="bi bi-people me-2"></i> Anggota</a>
            <a href="/peminjaman" class="nav-link px-3 py-2"><i class="bi bi-arrow-left-right me-2"></i> Peminjaman</a>
            <a href="/kategori" class="nav-link px-3 py-2"><i class="bi bi-tags me-2"></i> Kategori</a>
            <hr class="text-white my-2">
            <a href="/api-docs" class="nav-link px-3 py-2"><i class="bi bi-braces me-2"></i> REST API Docs</a>
        </nav>
    </div>
    <div class="col-md-10 p-4">
        <h4 class="mb-4">Dashboard</h4>

        <div class="row g-4 mb-4">
            <div class="col-md-4">
                <div class="card p-4" style="border-left:4px solid #3498db;">
                    <div class="d-flex justify-content-between align-items-center">
                        <div><p class="text-muted mb-1">Total Buku</p>
                        <h2 class="fw-bold text-primary" th:text="${totalBuku}">0</h2></div>
                        <i class="bi bi-journal-bookmark display-5 text-primary opacity-25"></i>
                    </div>
                    <a href="/buku" class="btn btn-sm btn-outline-primary mt-3">Kelola Buku →</a>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-4" style="border-left:4px solid #2ecc71;">
                    <div class="d-flex justify-content-between align-items-center">
                        <div><p class="text-muted mb-1">Total Anggota</p>
                        <h2 class="fw-bold text-success" th:text="${totalAnggota}">0</h2></div>
                        <i class="bi bi-people display-5 text-success opacity-25"></i>
                    </div>
                    <a href="/anggota" class="btn btn-sm btn-outline-success mt-3">Kelola Anggota →</a>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-4" style="border-left:4px solid #e74c3c;">
                    <div class="d-flex justify-content-between align-items-center">
                        <div><p class="text-muted mb-1">Sedang Dipinjam</p>
                        <h2 class="fw-bold text-danger" th:text="${totalPeminjaman}">0</h2></div>
                        <i class="bi bi-arrow-left-right display-5 text-danger opacity-25"></i>
                    </div>
                    <a href="/peminjaman" class="btn btn-sm btn-outline-danger mt-3">Lihat Peminjaman →</a>
                </div>
            </div>
        </div>

    </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
