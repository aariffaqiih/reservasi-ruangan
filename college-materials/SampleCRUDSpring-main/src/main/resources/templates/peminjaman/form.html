<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Form Peminjaman - Perpustakaan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body{background:#f8f9fa;} .sidebar{min-height:100vh;background:#2c3e50;}
        .sidebar a{color:#ecf0f1;text-decoration:none;}
        .sidebar a:hover{background:#34495e;border-radius:5px;}
        .card{border:none;box-shadow:0 2px 10px rgba(0,0,0,.08);}
    </style>
</head>
<body>
<div class="container-fluid">
<div class="row">
    <div class="col-md-2 sidebar py-3 px-3">
        <h5 class="text-white text-center mb-4"><i class="bi bi-book-half"></i> Perpustakaan</h5>
        <hr class="text-white">
        <nav class="nav flex-column gap-1">
            <a href="/" class="nav-link px-3 py-2"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
            <a href="/buku" class="nav-link px-3 py-2"><i class="bi bi-journal-bookmark me-2"></i> Buku</a>
            <a href="/anggota" class="nav-link px-3 py-2"><i class="bi bi-people me-2"></i> Anggota</a>
            <a href="/peminjaman" class="nav-link px-3 py-2 active" style="background:#3498db;border-radius:5px;"><i class="bi bi-arrow-left-right me-2"></i> Peminjaman</a>
            <a href="/kategori" class="nav-link px-3 py-2"><i class="bi bi-tags me-2"></i> Kategori</a>
            <hr class="text-white my-2">
            <a href="/api-docs" class="nav-link px-3 py-2"><i class="bi bi-braces me-2"></i> REST API Docs</a>
        </nav>
    </div>
    <div class="col-md-10 p-4">
        <div class="d-flex align-items-center mb-4">
            <a href="/peminjaman" class="btn btn-outline-secondary me-3"><i class="bi bi-arrow-left"></i></a>
            <h4 class="mb-0">Form Peminjaman Buku</h4>
        </div>
        <div class="card p-4" style="max-width:600px;">
            <div class="alert alert-info mb-4"><i class="bi bi-info-circle me-2"></i>Batas peminjaman: <strong>7 hari</strong> dari tanggal pinjam.</div>
            <form action="/peminjaman/simpan" method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Pilih Anggota <span class="text-danger">*</span></label>
                    <select class="form-select" name="anggotaId" required>
                        <option value="">-- Pilih Anggota --</option>
                        <option th:each="anggota : ${anggotaList}" th:value="${anggota.id}" th:text="${anggota.nama} + ' (' + ${anggota.email} + ')'"></option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Pilih Buku <span class="text-danger">*</span></label>
                    <select class="form-select" name="bukuId" required>
                        <option value="">-- Pilih Buku --</option>
                        <option th:each="buku : ${bukuList}" th:value="${buku.id}" th:text="${buku.judul} + ' - stok: ' + ${buku.stok}"></option>
                    </select>
                    <small class="text-muted">Hanya menampilkan buku yang tersedia (stok &gt; 0)</small>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i> Catat Peminjaman</button>
                    <a href="/peminjaman" class="btn btn-outline-secondary">Batal</a>
                </div>
            </form>
        </div>
    </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
