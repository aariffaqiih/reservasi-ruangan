<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kategori - Perpustakaan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body{background:#f8f9fa;} .sidebar{min-height:100vh;background:#2c3e50;}
        .sidebar a{color:#ecf0f1;text-decoration:none;}
        .sidebar a:hover{background:#34495e;border-radius:5px;}
        .card{border:none;box-shadow:0 2px 10px rgba(0,0,0,.08);}
    </style>
</head>
<body>
<div class="container-fluid">
<div class="row">
    <div class="col-md-2 sidebar py-3 px-3">
        <h5 class="text-white text-center mb-4"><i class="bi bi-book-half"></i> Perpustakaan</h5>
        <hr class="text-white">
        <nav class="nav flex-column gap-1">
            <a href="/" class="nav-link px-3 py-2"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
            <a href="/buku" class="nav-link px-3 py-2"><i class="bi bi-journal-bookmark me-2"></i> Buku</a>
            <a href="/anggota" class="nav-link px-3 py-2"><i class="bi bi-people me-2"></i> Anggota</a>
            <a href="/peminjaman" class="nav-link px-3 py-2"><i class="bi bi-arrow-left-right me-2"></i> Peminjaman</a>
            <a href="/kategori" class="nav-link px-3 py-2 active" style="background:#3498db;border-radius:5px;"><i class="bi bi-tags me-2"></i> Kategori</a>
            <hr class="text-white my-2">
            <a href="/api-docs" class="nav-link px-3 py-2"><i class="bi bi-braces me-2"></i> REST API Docs</a>
        </nav>
    </div>
    <div class="col-md-10 p-4">
        <h4 class="mb-4">Kelola Kategori</h4>
        <div th:if="${sukses}" class="alert alert-success alert-dismissible fade show">
            <i class="bi bi-check-circle me-2"></i><span th:text="${sukses}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card p-4">
                    <h6 class="mb-3"><i class="bi bi-plus-circle me-2"></i>Tambah Kategori</h6>
                    <form action="/kategori/simpan" method="post" th:object="${kategori}">
                        <input type="hidden" th:field="*{id}">
                        <div class="mb-3">
                            <label class="form-label">Nama Kategori</label>
                            <input type="text" class="form-control" th:field="*{nama}" placeholder="Contoh: Fiksi, Sains..." required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Deskripsi</label>
                            <textarea class="form-control" th:field="*{deskripsi}" rows="2" placeholder="Deskripsi singkat (opsional)"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100"><i class="bi bi-save me-1"></i> Simpan</button>
                    </form>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body p-0">
                        <table class="table table-hover mb-0">
                            <thead class="table-dark">
                                <tr><th>#</th><th>Nama</th><th>Deskripsi</th><th>Jumlah Buku</th><th>Aksi</th></tr>
                            </thead>
                            <tbody>
                                <tr th:each="kat, stat : ${kategoriList}">
                                    <td th:text="${stat.count}"></td>
                                    <td><span class="badge bg-info text-dark fs-6" th:text="${kat.nama}"></span></td>
                                    <td><small class="text-muted" th:text="${kat.deskripsi ?: '-'}"></small></td>
                                    <td><span class="badge bg-secondary" th:text="${kat.bukuList != null ? kat.bukuList.size() : 0} + ' buku'"></span></td>
                                    <td><a th:href="@{/kategori/hapus/{id}(id=${kat.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Hapus kategori ini?')"><i class="bi bi-trash"></i></a></td>
                                </tr>
                                <tr th:if="${kategoriList.isEmpty()}">
                                    <td colspan="5" class="text-center text-muted py-3">Belum ada kategori.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
