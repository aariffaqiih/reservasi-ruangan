<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detail Anggota - Perpustakaan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body{background:#f8f9fa;} .sidebar{min-height:100vh;background:#2c3e50;}
        .sidebar a{color:#ecf0f1;text-decoration:none;}
        .sidebar a:hover{background:#34495e;border-radius:5px;}
        .card{border:none;box-shadow:0 2px 10px rgba(0,0,0,.08);}
    </style>
</head>
<body>
<div class="container-fluid">
<div class="row">
    <div class="col-md-2 sidebar py-3 px-3">
        <h5 class="text-white text-center mb-4"><i class="bi bi-book-half"></i> Perpustakaan</h5>
        <hr class="text-white">
        <nav class="nav flex-column gap-1">
            <a href="/" class="nav-link px-3 py-2"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
            <a href="/buku" class="nav-link px-3 py-2"><i class="bi bi-journal-bookmark me-2"></i> Buku</a>
            <a href="/anggota" class="nav-link px-3 py-2 active" style="background:#3498db;border-radius:5px;"><i class="bi bi-people me-2"></i> Anggota</a>
            <a href="/peminjaman" class="nav-link px-3 py-2"><i class="bi bi-arrow-left-right me-2"></i> Peminjaman</a>
            <a href="/kategori" class="nav-link px-3 py-2"><i class="bi bi-tags me-2"></i> Kategori</a>
            <hr class="text-white my-2">
            <a href="/api-docs" class="nav-link px-3 py-2"><i class="bi bi-braces me-2"></i> REST API Docs</a>
        </nav>
    </div>

    <div class="col-md-10 p-4">
        <div class="d-flex align-items-center mb-4">
            <a href="/anggota" class="btn btn-outline-secondary me-3"><i class="bi bi-arrow-left"></i></a>
            <h4 class="mb-0">Detail Anggota</h4>
        </div>
        <div class="row g-4">
            <div class="col-md-5">
                <div class="card p-4">
                    <div class="text-center mb-4">
                        <div class="rounded-circle bg-primary d-inline-flex align-items-center justify-content-center text-white" style="width:80px;height:80px;font-size:2rem;">
                            <i class="bi bi-person"></i>
                        </div>
                        <h5 class="mt-3 mb-0" th:text="${anggota.nama}"></h5>
                        <small class="text-muted" th:text="${anggota.email}"></small>
                    </div>
                    <table class="table table-sm">
                        <tr><td class="text-muted">No HP</td><td th:text="${anggota.noHp}">-</td></tr>
                        <tr th:if="${anggota.profil != null}"><td class="text-muted">Alamat</td><td th:text="${anggota.profil.alamat}">-</td></tr>
                        <tr th:if="${anggota.profil != null}"><td class="text-muted">Tgl Lahir</td><td th:text="${anggota.profil.tanggalLahir}">-</td></tr>
                        <tr th:if="${anggota.profil != null}"><td class="text-muted">Jenis Kelamin</td><td th:text="${anggota.profil.jenisKelamin == 'L' ? 'Laki-laki' : 'Perempuan'}">-</td></tr>
                    </table>
                    <a th:href="@{/anggota/edit/{id}(id=${anggota.id})}" class="btn btn-warning btn-sm w-100"><i class="bi bi-pencil me-1"></i> Edit Data</a>
                </div>
            </div>
            <div class="col-md-7">
                <div class="card p-4">
                    <h6 class="mb-3"><i class="bi bi-clock-history me-2"></i>Riwayat Peminjaman
                        <span class="badge bg-secondary ms-2" th:text="${anggota.peminjaman != null ? anggota.peminjaman.size() : 0}"></span>
                    </h6>
                    <p th:if="${anggota.peminjaman == null or anggota.peminjaman.isEmpty()}" class="text-center text-muted py-3 mb-0">Belum pernah meminjam buku.</p>
                    <table th:if="${anggota.peminjaman != null and !anggota.peminjaman.isEmpty()}" class="table table-sm">
                        <thead><tr><th>Buku</th><th>Tgl Pinjam</th><th>Status</th></tr></thead>
                        <tbody>
                            <tr th:each="p : ${anggota.peminjaman}">
                                <td th:text="${p.buku.judul}"></td>
                                <td th:text="${p.tanggalPinjam}"></td>
                                <td>
                                    <span th:if="${p.status == 'DIPINJAM'}" class="badge bg-warning text-dark">Dipinjam</span>
                                    <span th:if="${p.status == 'DIKEMBALIKAN'}" class="badge bg-success">Dikembalikan</span>
                                    <span th:if="${p.status == 'TERLAMBAT'}" class="badge bg-danger">Terlambat</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
