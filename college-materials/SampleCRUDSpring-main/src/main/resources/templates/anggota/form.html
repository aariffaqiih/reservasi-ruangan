<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle} + ' - Perpustakaan'">Form Anggota</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body{background:#f8f9fa;} .sidebar{min-height:100vh;background:#2c3e50;}
        .sidebar a{color:#ecf0f1;text-decoration:none;}
        .sidebar a:hover{background:#34495e;border-radius:5px;}
        .card{border:none;box-shadow:0 2px 10px rgba(0,0,0,.08);}
    </style>
</head>
<body>
<div class="container-fluid">
<div class="row">
    <div class="col-md-2 sidebar py-3 px-3">
        <h5 class="text-white text-center mb-4"><i class="bi bi-book-half"></i> Perpustakaan</h5>
        <hr class="text-white">
        <nav class="nav flex-column gap-1">
            <a href="/" class="nav-link px-3 py-2"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
            <a href="/buku" class="nav-link px-3 py-2"><i class="bi bi-journal-bookmark me-2"></i> Buku</a>
            <a href="/anggota" class="nav-link px-3 py-2 active" style="background:#3498db;border-radius:5px;"><i class="bi bi-people me-2"></i> Anggota</a>
            <a href="/peminjaman" class="nav-link px-3 py-2"><i class="bi bi-arrow-left-right me-2"></i> Peminjaman</a>
            <a href="/kategori" class="nav-link px-3 py-2"><i class="bi bi-tags me-2"></i> Kategori</a>
            <hr class="text-white my-2">
            <a href="/api-docs" class="nav-link px-3 py-2"><i class="bi bi-braces me-2"></i> REST API Docs</a>
        </nav>
    </div>
    <div class="col-md-10 p-4">
        <div class="d-flex align-items-center mb-4">
            <a href="/anggota" class="btn btn-outline-secondary me-3"><i class="bi bi-arrow-left"></i></a>
            <h4 class="mb-0" th:text="${pageTitle}">Form Anggota</h4>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" style="max-width:700px;">
            <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div class="card p-4" style="max-width:700px;">
            <form th:action="${anggota.id != null ? '/anggota/update' : '/anggota/simpan'}" method="post">
                <input type="hidden" name="id" th:value="${anggota.id}">
                <h6 class="text-primary mb-3"><i class="bi bi-person me-2"></i>Data Anggota</h6>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Nama Lengkap <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="nama" th:value="${anggota.nama}" placeholder="Nama lengkap" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
                    <input type="email" class="form-control" name="email" th:value="${anggota.email}" placeholder="contoh@email.com" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">No HP <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="noHp" th:value="${anggota.noHp}" placeholder="081234567890" required>
                    <small class="text-muted">10-13 digit angka</small>
                </div>
                <hr>
                <h6 class="text-success mb-3"><i class="bi bi-card-text me-2"></i>Data Profil <small class="text-muted fw-normal">(One To One)</small></h6>
                <input type="hidden" name="profilId" th:value="${profil?.id}">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Alamat</label>
                    <textarea class="form-control" name="profilAlamat" rows="3" placeholder="Alamat lengkap" th:text="${profil?.alamat}"></textarea>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Tanggal Lahir</label>
                        <input type="date" class="form-control" name="profilTanggalLahir" th:value="${profil?.tanggalLahir}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Jenis Kelamin</label>
                        <select class="form-select" name="profilJenisKelamin">
                            <option value="">-- Pilih --</option>
                            <option value="L" th:selected="${profil?.jenisKelamin == 'L'}">Laki-laki</option>
                            <option value="P" th:selected="${profil?.jenisKelamin == 'P'}">Perempuan</option>
                        </select>
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i> Simpan</button>
                    <a href="/anggota" class="btn btn-outline-secondary">Batal</a>
                </div>
            </form>
        </div>
    </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
