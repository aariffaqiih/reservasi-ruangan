<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Daftar Anggota - Perpustakaan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body{background:#f8f9fa;} .sidebar{min-height:100vh;background:#2c3e50;}
        .sidebar a{color:#ecf0f1;text-decoration:none;}
        .sidebar a:hover{background:#34495e;border-radius:5px;}
        .card{border:none;box-shadow:0 2px 10px rgba(0,0,0,.08);}
    </style>
</head>
<body>
<div class="container-fluid">
<div class="row">
    <div class="col-md-2 sidebar py-3 px-3">
        <h5 class="text-white text-center mb-4"><i class="bi bi-book-half"></i> Perpustakaan</h5>
        <hr class="text-white">
        <nav class="nav flex-column gap-1">
            <a href="/" class="nav-link px-3 py-2"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
            <a href="/buku" class="nav-link px-3 py-2"><i class="bi bi-journal-bookmark me-2"></i> Buku</a>
            <a href="/anggota" class="nav-link px-3 py-2 active" style="background:#3498db;border-radius:5px;"><i class="bi bi-people me-2"></i> Anggota</a>
            <a href="/peminjaman" class="nav-link px-3 py-2"><i class="bi bi-arrow-left-right me-2"></i> Peminjaman</a>
            <a href="/kategori" class="nav-link px-3 py-2"><i class="bi bi-tags me-2"></i> Kategori</a>
            <hr class="text-white my-2">
            <a href="/api-docs" class="nav-link px-3 py-2"><i class="bi bi-braces me-2"></i> REST API Docs</a>
        </nav>
    </div>


    <div class="col-md-10 p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="mb-0">Daftar Anggota</h4>
            <a href="/anggota/tambah" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i> Daftar Anggota Baru</a>
        </div>

        <div th:if="${sukses}" class="alert alert-success alert-dismissible fade show">
            <i class="bi bi-check-circle me-2"></i><span th:text="${sukses}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>#</th>
                            <th>Nama</th>
                            <th>Email</th>
                            <th>No HP</th>
                            <th>Alamat</th>
                            <th>Total Pinjam</th>
                            <th>Aksi</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="anggota, stat : ${anggotaList}">
                            <td th:text="${stat.count}"></td>
                            <td><strong th:text="${anggota.nama}"></strong></td>
                            <td th:text="${anggota.email}"></td>
                            <td th:text="${anggota.noHp}"></td>
                            <td>
                                <small th:if="${anggota.profil != null}" th:text="${anggota.profil.alamat}" class="text-muted"></small>
                                <small th:if="${anggota.profil == null}" class="text-muted">-</small>
                            </td>
                            <td>
                                <span class="badge bg-secondary" th:text="${anggota.peminjaman != null ? anggota.peminjaman.size() : 0} + ' buku'"></span>
                            </td>
                            <td>
                                <a th:href="@{/anggota/detail/{id}(id=${anggota.id})}" class="btn btn-sm btn-info text-white me-1"><i class="bi bi-eye"></i></a>
                                <a th:href="@{/anggota/edit/{id}(id=${anggota.id})}" class="btn btn-sm btn-warning me-1"><i class="bi bi-pencil"></i></a>
                                <a th:href="@{/anggota/hapus/{id}(id=${anggota.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Hapus anggota ini?')"><i class="bi bi-trash"></i></a>
                            </td>
                        </tr>

                        <tr th:if="${anggotaList.isEmpty()}">
                            <td colspan="7" class="text-center text-muted py-4">
                                <i class="bi bi-people display-6 d-block mb-2"></i>Belum ada anggota terdaftar.
                            </td>
                        </tr>

                    </tbody>
                </table>
            </div>
        </div>


    </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
