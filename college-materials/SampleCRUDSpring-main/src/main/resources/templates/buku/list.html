<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Daftar Buku - Perpustakaan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body{background:#f8f9fa;} .sidebar{min-height:100vh;background:#2c3e50;}
        .sidebar a{color:#ecf0f1;text-decoration:none;}
        .sidebar a:hover{background:#34495e;border-radius:5px;}
        .card{border:none;box-shadow:0 2px 10px rgba(0,0,0,.08);}
    </style>
</head>
<body>
<div class="container-fluid">
<div class="row">
    <div class="col-md-2 sidebar py-3 px-3">
        <h5 class="text-white text-center mb-4"><i class="bi bi-book-half"></i> Perpustakaan</h5>
        <hr class="text-white">
        <nav class="nav flex-column gap-1">
            <a href="/" class="nav-link px-3 py-2"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
            <a href="/buku" class="nav-link px-3 py-2 active" style="background:#3498db;border-radius:5px;"><i class="bi bi-journal-bookmark me-2"></i> Buku</a>
            <a href="/anggota" class="nav-link px-3 py-2"><i class="bi bi-people me-2"></i> Anggota</a>
            <a href="/peminjaman" class="nav-link px-3 py-2"><i class="bi bi-arrow-left-right me-2"></i> Peminjaman</a>
            <a href="/kategori" class="nav-link px-3 py-2"><i class="bi bi-tags me-2"></i> Kategori</a>
            <hr class="text-white my-2">
            <a href="/api-docs" class="nav-link px-3 py-2"><i class="bi bi-braces me-2"></i> REST API Docs</a>
        </nav>
    </div>
    <div class="col-md-10 p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="mb-0">Daftar Buku</h4>
            <a href="/buku/tambah" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i> Tambah Buku</a>
        </div>
        <div th:if="${sukses}" class="alert alert-success alert-dismissible fade show">
            <i class="bi bi-check-circle me-2"></i><span th:text="${sukses}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- FORM PENCARIAN -->
        <div class="card p-3 mb-4">
            <form action="/buku" method="get" class="row g-2 align-items-end">
                <div class="col-md-5">
                    <label class="form-label fw-semibold mb-1"><i class="bi bi-search me-1"></i>Kata Kunci</label>
                    <input type="text" class="form-control" name="keyword" th:value="${keyword}" placeholder="Judul atau nama penulis...">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold mb-1">Cari Berdasarkan</label>
                    <select class="form-select" name="cari">
                        <option value="judul"   th:selected="${cari == 'judul' or cari == null}">Judul</option>
                        <option value="penulis" th:selected="${cari == 'penulis'}">Penulis</option>
                    </select>
                </div>
                <div class="col-md-auto">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-search me-1"></i> Cari</button>
                    <a href="/buku" class="btn btn-outline-secondary ms-1" th:if="${keyword != null}"><i class="bi bi-x-lg me-1"></i> Reset</a>
                </div>
            </form>
        </div>

        <div th:if="${infoHasil}" class="alert alert-info py-2 mb-3">
            <i class="bi bi-info-circle me-2"></i><span th:text="${infoHasil}"></span>
            — <a href="/buku" class="alert-link">Tampilkan semua buku</a>
        </div>

        <div class="card">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="table-dark">
                        <tr><th>#</th><th>Judul</th><th>Penulis</th><th>ISBN</th><th>Tahun</th><th>Kategori</th><th>Stok</th><th>Aksi</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="buku, stat : ${bukuList}">
                            <td th:text="${stat.count}"></td>
                            <td>
                                <span th:if="${keyword == null}" th:text="${buku.judul}"></span>
                                <span th:if="${keyword != null and cari == 'judul'}" th:utext="${#strings.replace(buku.judul, keyword, '&lt;mark&gt;' + keyword + '&lt;/mark&gt;')}"></span>
                                <span th:if="${keyword != null and cari == 'penulis'}" th:text="${buku.judul}"></span>
                            </td>
                            <td>
                                <span th:if="${keyword == null}" th:text="${buku.penulis}"></span>
                                <span th:if="${keyword != null and cari == 'penulis'}" th:utext="${#strings.replace(buku.penulis, keyword, '&lt;mark&gt;' + keyword + '&lt;/mark&gt;')}"></span>
                                <span th:if="${keyword != null and cari == 'judul'}" th:text="${buku.penulis}"></span>
                            </td>
                            <td><small class="text-muted" th:text="${buku.isbn}"></small></td>
                            <td th:text="${buku.tahunTerbit}"></td>
                            <td>
                                <span th:each="kat : ${buku.kategoriList}" class="badge bg-info text-dark me-1" th:text="${kat.nama}"></span>
                                <span th:if="${buku.kategoriList == null or buku.kategoriList.isEmpty()}" class="text-muted">-</span>
                            </td>
                            <td>
                                <span th:if="${buku.stok > 0}" class="badge bg-success" th:text="${buku.stok} + ' tersedia'"></span>
                                <span th:if="${buku.stok == 0}" class="badge bg-danger">Habis</span>
                            </td>
                            <td>
                                <a th:href="@{/buku/edit/{id}(id=${buku.id})}" class="btn btn-sm btn-warning me-1"><i class="bi bi-pencil"></i></a>
                                <a th:href="@{/buku/hapus/{id}(id=${buku.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Yakin hapus buku ini?')"><i class="bi bi-trash"></i></a>
                            </td>
                        </tr>
                        <tr th:if="${bukuList.isEmpty() and keyword == null}">
                            <td colspan="8" class="text-center text-muted py-4">
                                <i class="bi bi-inbox display-6 d-block mb-2"></i>Belum ada data buku. <a href="/buku/tambah">Tambah sekarang</a>
                            </td>
                        </tr>
                        <tr th:if="${bukuList.isEmpty() and keyword != null}">
                            <td colspan="8" class="text-center text-muted py-4">
                                <i class="bi bi-search display-6 d-block mb-2"></i>
                                Tidak ada hasil untuk "<strong th:text="${keyword}"></strong>". <a href="/buku">Lihat semua</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="card-footer text-muted small py-2 px-3" th:if="${!bukuList.isEmpty()}">
                Menampilkan <strong th:text="${bukuList.size()}"></strong> buku
                <span th:if="${keyword != null}"> — hasil pencarian "<em th:text="${keyword}"></em>"</span>
            </div>
        </div>
    </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
