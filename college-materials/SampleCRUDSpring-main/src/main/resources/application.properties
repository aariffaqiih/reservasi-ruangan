# =============================================
# KONFIGURASI DATABASE
# Ubah username dan password sesuai MySQL kamu
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3306/db_perpustakaan?useSSL=false&serverTimezone=Asia/Jakarta
spring.datasource.username=root
spring.datasource.password=

# Driver MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# KONFIGURASI HIBERNATE / JPA
# =============================================

# update  = otomatis update struktur tabel
# create  = hapus dan buat ulang tabel setiap restart (hati-hati, data hilang!)
# validate = hanya validasi, tidak ubah tabel
spring.jpa.hibernate.ddl-auto=update

# Tampilkan SQL di console (berguna saat belajar)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialect MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# =============================================
# KONFIGURASI THYMELEAF
# =============================================
spring.thymeleaf.cache=false
spring.thymeleaf.suffix=.html
spring.thymeleaf.prefix=classpath:/templates/

# =============================================
# KONFIGURASI SERVER
# =============================================
server.port=8080

# Nama aplikasi
spring.application.name=Sistem Perpustakaan
