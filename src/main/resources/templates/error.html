<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <main class="login-page">
        <section class="card">
            <span class="eyebrow">Error</span>
            <h1>Terjadi Kesalahan</h1>
            <table>
                <tbody>
                    <tr><th>Status</th><td th:text="${status}">500</td></tr>
                    <tr><th>Error</th><td th:text="${error}">Internal Server Error</td></tr>
                    <tr><th>Pesan</th><td th:text="${message}">Terjadi kesalahan.</td></tr>
                    <tr><th>Path</th><td th:text="${path}">/path</td></tr>
                </tbody>
            </table>
            <br>
            <a class="button" th:href="@{/dashboard}">Kembali ke Dashboard</a>
        </section>
    </main>
</body>
</html>
